version: '3.8'

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4
  # ------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: panchayat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_panchayat}
      POSTGRES_DB: ${POSTGRES_DB:-panchayat_weather}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d panchayat_weather"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panchayat-network

  # ------------------------------------------------------------
  # FastAPI ML Service
  # ------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: panchayat_ml_service
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: 8000
      ML_ENV: production
      MODEL_VERSION: v0.1.0-alpha
      MODELS_DIR: /app/models
    volumes:
      - ./data/processed/models:/app/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panchayat-network

  # ------------------------------------------------------------
  # NestJS Application Backend
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panchayat_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_panchayat}@db:5432/${POSTGRES_DB:-panchayat_weather}
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panchayat-network

  # ------------------------------------------------------------
  # Next.js Frontend Dashboard
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: panchayat_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - panchayat-network

volumes:
  postgres_data:
    driver: local

networks:
  panchayat-network:
    driver: bridge
